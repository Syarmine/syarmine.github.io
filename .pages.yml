# Pages CMS configuration (https://pagescms.org).
# Sign in at https://app.pagescms.org with GitHub, open this repository on the
# gh-pages branch, and each section below appears as a form. Saving commits to
# the branch and GitHub Pages rebuilds the site.

content:
  - name: profile
    label: Summary
    type: file
    path: _data/profile.yml
    fields:
      - { name: headline, label: Headline, type: string }
      - { name: summary, label: Professional summary, type: text }
      - name: facts
        label: At a glance
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }

  - name: expertise
    label: Expertise
    type: file
    path: _data/expertise.yml
    list: true
    fields:
      - { name: group, label: Group, type: string }
      - name: icon
        label: Icon
        type: select
        options: { values: [code, chart, layers, cloud, people, spark, pulse] }
      - { name: items, label: Tools, type: string, list: true }

  - name: projects
    label: Projects
    type: file
    path: _data/projects.yml
    list: true
    fields:
      - { name: id, label: "ID (short, unique, no spaces)", type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: category, label: Category, type: string }
      - { name: summary, label: Card summary, type: text }
      - { name: stack, label: Stack, type: string, list: true }
      - name: visual
        label: Card visual
        type: select
        options: { values: [bars, line, stacked, hbar, area, dots, arch, pipeline] }
      - name: tone
        label: Accent colour
        type: select
        options: { values: [brand, free, warning, success] }
      - { name: challenge, label: Challenge, type: text }
      - { name: solution, label: Solution, type: text }
      - name: outcomes
        label: Outcomes
        type: object
        list: true
        fields:
          - { name: value, label: "Number (e.g. −35%)", type: string }
          - { name: label, label: What it measures, type: string }
      - { name: placeholder, label: Figures are placeholders, type: boolean }

  - name: career
    label: Career
    type: file
    path: _data/career.yml
    list: true
    fields:
      - { name: role, label: Role, type: string }
      - { name: org, label: Organisation, type: string }
      - { name: period, label: "Period (e.g. 2021 – Present)", type: string }
      - { name: location, label: Location, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: current, label: Current role, type: boolean }

  - name: education
    label: Education
    type: file
    path: _data/education.yml
    list: true
    fields:
      - { name: degree, label: Degree, type: string }
      - { name: school, label: Institution, type: string }
      - { name: period, label: Period, type: string }

  - name: credentials
    label: Credentials
    type: file
    path: _data/credentials.yml
    list: true
    fields:
      - { name: name, label: Credential, type: string }
      - { name: issuer, label: Issuer, type: string }
      - { name: code, label: "Exam or ID (e.g. PL-300)", type: string }
      - { name: year, label: Year, type: string }
      - { name: url, label: Verification link, type: string }
