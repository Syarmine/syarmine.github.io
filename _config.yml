# ------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------
title: "Syarmine Shah"
tagline: "Health systems, policy and technology"
description: >-
  Analysis of how governments and institutions pay for care, adopt
  technology and make decisions under uncertainty.
url: "https://syarmine.github.io"
baseurl: ""
lang: en

# ------------------------------------------------------------------
# Site owner, used in the footer, post bylines and the contact panel
# ------------------------------------------------------------------
author:
  name: "Syarmine Shah"
  # The primary contact button points here
  contact_url: "https://www.linkedin.com/in/drsyarmine-shah/"

# Social links. Remove a line to hide it.
social:
  linkedin: "https://www.linkedin.com/in/drsyarmine-shah/"
  github: "https://github.com/Syarmine"
  twitter: "https://twitter.com/SyarmineS"

# Preview content. While true, sample cards (clearly badged "Sample") fill
# the analysis and chart carousels until real posts and dashboards exist.
# Set to false before publishing.
show_samples: false

# Google Analytics (GA4) measurement ID. Leave empty to disable.
google_analytics: "G-YYY2YQEEPB"

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - .dockerignore
  - _vendor
  - vendor
