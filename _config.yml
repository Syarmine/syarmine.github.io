# ------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------
title: "Syarmine Shah"
tagline: "Economics, technology and institutions"
description: >-
  Essays and analysis on economics, technology, institutions and how
  decisions get made.
url: "https://syarmine.github.io"
baseurl: ""
lang: en

# ------------------------------------------------------------------
# Site owner, used in the footer, post bylines and the contact panel
# ------------------------------------------------------------------
author:
  name: "Syarmine Shah"
  # The primary contact button points here
  contact_url: "https://www.linkedin.com/in/drsyarmine-shah/"

# Social links. Remove a line to hide it.
social:
  linkedin: "https://www.linkedin.com/in/drsyarmine-shah/"
  github: "https://github.com/Syarmine"
  twitter: "https://twitter.com/SyarmineS"

# Sample content. While true, sample articles (posts with `sample: true`) and
# sample chart cards are shown. Their charts are labelled "Illustrative data".
# Set to false to hide them everywhere once real content is in place.
show_samples: true

# Google Analytics (GA4) measurement ID. Leave empty to disable.
google_analytics: "G-YYY2YQEEPB"

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - .dockerignore
  - _vendor
  - vendor
  - .pages.yml
