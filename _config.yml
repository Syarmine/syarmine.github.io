# ------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------
title: "Syarmine Shah"
tagline: "Health systems, policy, AI and institutions"
description: >-
  Writing and work on how health systems and institutions make decisions,
  and how evidence, technology and capability change what they can do.
url: "https://syarmine.github.io"
baseurl: ""
lang: en

# ------------------------------------------------------------------
# Site owner, used in the footer, post bylines and the contact panel
# ------------------------------------------------------------------
author:
  name: "Syarmine Shah"
  # The primary contact button points here
  contact_url: "https://www.linkedin.com/in/drsyarmine-shah/"

# Social links. Remove a line to hide it.
social:
  linkedin: "https://www.linkedin.com/in/drsyarmine-shah/"
  github: "https://github.com/Syarmine"
  twitter: "https://twitter.com/SyarmineS"

# Google Analytics (GA4) measurement ID. Leave empty to disable.
google_analytics: "G-YYY2YQEEPB"

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - .dockerignore
  - _vendor
  - vendor
