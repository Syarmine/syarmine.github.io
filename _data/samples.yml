# Sample chart cards, shown only while `show_samples: true` in _config.yml and
# only until _data/dashboards.yml has real entries. Each renders with a
# "Sample" badge and no link. Sample articles live in _posts/ (sample: true).

charts:
  - kicker: "Economics"
    title: "Where the budget actually goes"
    rubric: "Fixed, committed and discretionary spending as a share of the total."
    chart: stacked
    tone: brand
    source: "Illustrative data"
  - kicker: "Technology"
    title: "How fast new tools spread"
    rubric: "Adoption of a new tool across teams, months after launch."
    chart: line
    tone: free
    source: "Illustrative data"
  - kicker: "Productivity"
    title: "Hours worked against output"
    rubric: "Does more time in the office mean more done?"
    chart: dots
    tone: warning
    source: "Illustrative data"
  - kicker: "Organisations"
    title: "Where projects stop"
    rubric: "Share of initiatives reaching each stage, from idea to rollout."
    chart: hbar
    tone: success
    source: "Illustrative data"
