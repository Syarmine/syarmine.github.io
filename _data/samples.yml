# Sample chart cards, shown only while `show_samples: true` in _config.yml and
# only until _data/dashboards.yml has real entries. Each renders with a
# "Sample" badge and no link. Sample articles live in _posts/ (sample: true).

charts:
  - kicker: "Health financing"
    title: "Who pays for health care in ASEAN?"
    rubric: "Government, insurance and out-of-pocket shares of health spending, by country."
    chart: stacked
    tone: brand
    source: "Illustrative data"
  - kicker: "Workforce"
    title: "Doctors per 1,000 people since 2000"
    rubric: "Malaysia against regional and OECD medians."
    chart: line
    tone: free
    source: "Illustrative data"
  - kicker: "Demography"
    title: "Ageing and the health budget"
    rubric: "Population over 65 and projected public health spending."
    chart: area
    tone: warning
    source: "Illustrative data"
  - kicker: "Technology"
    title: "Where public-sector AI projects stop"
    rubric: "Share of projects reaching each stage, from pilot to production."
    chart: hbar
    tone: success
    source: "Illustrative data"
