- id: data-quality
  title: "Data quality and governance"
  category: "Data governance"
  stack: ["Python", "SQL", "GitHub", "Azure Repos"]
  visual: pipeline
  tone: success
  summary: "Validation frameworks and automated checks that kept a large system migration loss-free and audit-ready."
  challenge: >-
    A large enterprise system migration put data integrity at risk, regulatory
    reviews of large datasets were slow and manual, and hard-coded Python and SQL
    made analyses hard to reproduce for audit.
  solution: >-
    Established validation and quality assurance frameworks for the migration,
    automated data quality checks, moved code into GitHub and Azure Repos, and
    documented methods and governance so audits can trace every step.
  outcomes:
    - value: "−70%"
      label: "Review time"
    - value: "99%"
      label: "Check accuracy on big data"
    - value: "Zero loss"
      label: "Through system migration"

- id: branch-risk
  title: "Nationwide branch financial and risk analytics"
  category: "Financial services · Risk analytics"
  stack: ["T-SQL", "Python", "Power BI", "Google Geocoding API"]
  visual: arch
  tone: warning
  summary: "First firm-level and aggregate financial analysis across 700 branches, on a new star-schema warehouse."
  challenge: >-
    Financial and risk monitoring across 700 branches ran on legacy Excel models,
    with no single source of truth and no view of where firms were located.
  solution: >-
    Designed a pipeline ingesting multiple sources into a star-schema warehouse in
    T-SQL, replaced Excel models with Python, geocoded firm locations, and built
    Power BI dashboards to the ISO 8000 data quality framework with a team of 15.
  outcomes:
    - value: "700"
      label: "Branches analysed"
    - value: "−30%"
      label: "Time to production"
    - value: "Near real time"
      label: "Monitoring and reporting"

