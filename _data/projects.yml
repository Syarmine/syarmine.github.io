# Projects and case studies (carousel + pop-up). Figures are from the CV and
# LinkedIn profile.
# visual: line, bars, stacked, hbar, area, dots, arch, pipeline
- id: data-platform
  title: "Unified AI and BI data platform"
  category: "Energy · Data platform"
  stack: ["Microsoft Fabric", "Databricks", "Dataflows", "Power BI"]
  visual: arch
  tone: brand
  summary: "A governed semantic foundation on Fabric and Databricks so leaders self-serve and analysts stop firefighting reports."
  challenge: >-
    Capital and operating cost reporting was spread across many models, so
    analysts spent their time maintaining reports instead of answering
    questions, and leaders could not trust one version of the numbers.
  solution: >-
    Defined how data is modelled, governed and consumed at scale on Microsoft
    Fabric and Databricks, and built a trusted semantic layer with Dataflows,
    Python and Power Query that removed manual refresh steps.
  outcomes:
    - value: "+20%"
      label: "Reporting efficiency"
    - value: "Self-serve"
      label: "Decisions for business leadership"
    - value: "CAPEX + OPEX"
      label: "On one semantic layer"

- id: demand-planning
  title: "Global demand planning MI"
  category: "Energy · Supply chain"
  stack: ["SAP", "JDE", "Kinaxis", "Power BI"]
  visual: bars
  tone: free
  summary: "End-to-end integration across three planning systems for one supply chain view."
  challenge: >-
    Demand and supply data for key products sat in JDE, Kinaxis and SAP, so
    planners across global markets worked from silos and forecasts lagged.
  solution: >-
    Architected cross-platform integration of the three systems into a unified
    supply chain MI framework, and led the production Power BI reports used to
    monitor and forecast demand and supply.
  outcomes:
    - value: "50"
      label: "Production reports"
    - value: "700+"
      label: "Plants monitored"
    - value: "3 → 1"
      label: "Planning systems unified"

- id: sustainability
  title: "Global sustainability MI"
  category: "Energy · ESG and Scope 3"
  stack: ["Power BI", "Fabric", "Data governance"]
  visual: stacked
  tone: success
  summary: "Consistent ESG and Scope 3 tracking across six regions for regulatory reporting."
  challenge: >-
    Sustainability metrics were tracked differently in each region, which made
    cross-regional comparison and regulatory reporting slow and contested.
  solution: >-
    Architected and maintained global ESG and Scope 3 analytics on one set of
    definitions across six regions in Asia, the Middle East, the Americas and Europe.
  outcomes:
    - value: "6"
      label: "Regions on one definition"
    - value: "Scope 3"
      label: "Emissions coverage"
    - value: "Regulatory"
      label: "Reporting supported"

- id: health-control-tower
  title: "Health and wellbeing control tower"
  category: "Occupational health"
  stack: ["Power BI", "Data integration", "Occupational health"]
  visual: line
  tone: warning
  summary: "One intelligence platform for workforce health data that used to be scattered by region."
  challenge: >-
    Occupational health and wellbeing data for a global workforce was
    fragmented across regions, so risks surfaced
    late and interventions were hard to target.
  solution: >-
    Designed and deployed a control tower that consolidates multi-regional
    health data into a central platform, drawing on clinical and occupational
    health expertise to define what to measure.
  outcomes:
    - value: "Multi-region"
      label: "Health data consolidated"
    - value: "Proactive"
      label: "Workforce risk identification"
    - value: "At scale"
      label: "Evidence-based intervention"

- id: predictive-models
  title: "Experimentation and predictive models"
  category: "Energy · Advanced analytics"
  stack: ["Python", "Regression", "Classification", "A/B testing"]
  visual: dots
  tone: free
  summary: "A/B experiments and predictive models that improved product performance and cut process waste."
  challenge: >-
    Product and process decisions needed evidence on what actually improved
    customer outcomes, and early warning of where waste was building up.
  solution: >-
    Designed and deployed A/B experiments and built regression and classification
    models in Python to predict performance and flag waste before it occurred.
  outcomes:
    - value: "+15%"
      label: "Customer product performance"
    - value: "$1M"
      label: "Process waste prevented"
    - value: "15+"
