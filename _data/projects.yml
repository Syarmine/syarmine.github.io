# Projects and case studies (carousel + pop-up). Figures are from the CV.
# visual: line, bars, stacked, hbar, area, dots, arch, pipeline
- id: bp-supply-demand
  title: "Global supply and demand analytics"
  category: "bp · Data Analytics and AI"
  stack: ["Power BI", "Dataflows", "Python", "Power Query"]
  visual: bars
  tone: brand
  summary: "Production reporting to monitor and forecast product demand and supply across four regions."
  challenge: >-
    Demand and supply of key products had to be monitored and forecast across
    more than 700 energy plants in the EU, MENA, APAC and China, with reporting
    that relied on manual refresh steps.
  solution: >-
    Led and built a suite of production Power BI reports on governed Dataflows,
    with Python and Power Query handling transformation so refreshes run without
    manual steps.
  outcomes:
    - value: "50"
      label: "Production reports"
    - value: "700+"
      label: "Plants covered, 4 regions"
    - value: "+20%"
      label: "Reporting efficiency"

- id: bp-predictive
  title: "Experimentation and predictive models"
  category: "bp · Data Analytics and AI"
  stack: ["Python", "Regression", "Classification", "A/B testing"]
  visual: dots
  tone: free
  summary: "A/B experiments and predictive models that improved product performance and cut process waste."
  challenge: >-
    Product and process decisions needed evidence on what actually improved
    customer outcomes, and early warning of where waste was building up.
  solution: >-
    Designed and deployed A/B experiments and built regression and classification
    models in Python to predict performance and flag waste before it occurred.
  outcomes:
    - value: "+15%"
      label: "Customer product performance"
    - value: "$1M"
      label: "Process waste prevented"
    - value: "15+"
      label: "Business metrics defined"

- id: bp-data-quality
  title: "Automated data quality for regulatory compliance"
  category: "bp · Data governance"
  stack: ["Python", "SQL", "GitHub", "Azure Repos"]
  visual: pipeline
  tone: success
  summary: "Automated checks and version-controlled pipelines that made regulatory review faster and reproducible."
  challenge: >-
    Regulatory reviews of large datasets were slow and manual, and hard-coded
    Python and SQL made analyses hard to reproduce for audit.
  solution: >-
    Automated data quality checks, moved processing into Power Query with code in
    GitHub and Azure Repos, and documented methods and governance so audits can
    trace every step.
  outcomes:
    - value: "−70%"
      label: "Review time"
    - value: "99%"
      label: "Check accuracy on big data"
    - value: "−20%"
      label: "Technical debt"

- id: kotak-branches
  title: "Nationwide branch financial and risk analytics"
  category: "Kotak Sakti · Lead Data Analyst"
  stack: ["T-SQL", "Python", "Power BI", "Google Geocoding API"]
  visual: arch
  tone: warning
  summary: "First firm-level and aggregate financial analysis across 700 branches, on a new star-schema warehouse."
  challenge: >-
    Financial and risk monitoring across 700 branches ran on legacy Excel models,
    with no single source of truth and no view of where firms were located.
  solution: >-
    Designed a pipeline ingesting multiple sources into a star-schema warehouse in
    T-SQL, replaced Excel models with Python, geocoded firm locations, and built
    Power BI dashboards to the ISO 8000 data quality framework with a team of 15.
  outcomes:
    - value: "700"
      label: "Branches analysed"
    - value: "−30%"
      label: "Time to production"
    - value: "Near real time"
      label: "Monitoring and reporting"

- id: socso-screening
  title: "Digital health screening programme"
  category: "SOCSO · Lead Policy Analyst"
  stack: ["Mobile app", "Programme delivery", "Change management"]
  visual: line
  tone: brand
  summary: "Moved a paper voucher scheme to a mobile app, more than doubling uptake of health screening."
  challenge: >-
    Health screening vouchers were distributed physically, which limited reach
    and made uptake hard to track.
  solution: >-
    Led a team of 12 to digitalise the scheme into a mobile application, from
    requirements through rollout.
  outcomes:
    - value: "+150%"
      label: "Screening, year on year"
    - value: "12"
      label: "Team led"
    - value: "Paper → app"
      label: "Distribution model"

- id: socso-claims
  title: "Health insurance claims and fraud analytics"
  category: "SOCSO · Lead Policy Analyst"
  stack: ["Python", "SQL Server", "SharePoint", "Power BI"]
  visual: hbar
  tone: free
  summary: "Insurance analysis across firms, providers and beneficiaries that surfaced fraud and lifted provider performance."
  challenge: >-
    Claims data across firms, health providers and beneficiaries sat in separate
    systems and Excel workbooks, so fraud and weak provider performance went
    undetected.
  solution: >-
    Analysed the insurance market in Python, modernised ETL from SQL Server,
    SharePoint and OneDrive into Power BI, and led the move from Excel for
    executives and analysts.
  outcomes:
    - value: "$2M"
      label: "Fraudulent claims identified"
    - value: "+25%"
      label: "Provider performance"
    - value: "+70%"
      label: "Analysis workflow"
