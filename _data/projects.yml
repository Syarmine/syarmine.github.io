- title: "AI and machine learning for universal health coverage in Malaysia"
  type: "Research"
  year: "2023"
  description: >-
    A review of how AI and machine learning have been applied to health
    financing and development decisions. All twelve included studies ran
    on-premise and stopped at the research-model stage. The distance between a
    working model and a working programme turned out to be the more useful
    finding.
  tags: ["Health financing", "AI", "UHC"]
  tone: brand

