---
layout: default
---
<article class="post container narrow">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">{% include icon.html name="arrow-left" %} All writing</a>

  <header class="post-header">
    <span class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</span>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <img src="{{ site.author.avatar | relative_url }}" alt="" width="44" height="44">
    <div>
      <strong>{{ site.author.name }}</strong>
      <span>{{ site.author.role }} · {{ site.author.location }}</span>
    </div>
  </footer>
</article>
