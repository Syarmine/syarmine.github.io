<!-- _layouts/post.html -->
<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="theme-{{ site.resume_theme }}">
    <div class="wrapper">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
      </header>

      <article class="post-content">
        {{ content }}
      </article>

      <footer class="post-footer">
        <a href="{{ site.baseurl }}/blog">Back to Blog</a>
      </footer>

      <footer class="page-footer">
        <p class="footer-line"></p>
        <p class="footer-line">© 2023 Syarmine Shah. Powered by <a href="https://jekyllrb.com/">Jekyll</p>
      </footer>
    </div>
  </body>
</html>
